<div class="card-contenerdor">
    <div class="header">
        <h1>Informacion Torneo {{torneo?.titulo}}</h1>
    </div>
    <section class="cardInformacion">
        <div class="flayer">
            <img [src]="torneo?.imagen" [alt]="torneo?.titulo">
        </div>
        <div class="descripcionheader">
            <h1>{{torneo?.titulo}}</h1>
            <p>{{torneo?.descripcion}}</p>
        </div>
        <div class="datos-torneo">
            <div class="dato">
                <span > <i class="fa-solid fa-location-dot"></i></span>
                <div>
                    <strong>
                        {{torneo?.lugar}}
                    </strong>
                </div>
            </div>
            <div class="dato">
                <span><i class="fa-regular fa-calendar-days"></i></span>
                <strong>
                    {{torneo?.fecha}}
                </strong>
            </div>
            <div class="dato">
                <span><i class="fa-solid fa-clock"></i></span>
                <strong>
                    {{torneo?.hora}}
                </strong>
            </div>
            <div class="dato premio">
                <span><i class="fa-solid fa-trophy"></i></span>
                <strong>
                    {{torneo?.premios}}
                </strong>
            </div>
        </div>
    </section>
    <section class="eqipos-inscritos">
        <app-equipos></app-equipos>
    </section>
    <section class="seccion-Fisture">
        <app-fixture [visualizacion]="false"></app-fixture>
    </section>
</div>
