<div class="inscripcion-contenedor">
    <section class="inscripcion-header">
        <h1>Inscribirse a {{ torneo?.titulo }}</h1>
        <p class="inscripcion-subtitle">Completa el formulario para registrar tu equipo</p>
    </section>

    <div class="inscripcion-content">
        <!-- INFORMACIÓN DEL TORNEO -->
        <section class="torneo-info-card">
            <div class="torneo-info-header">
                <img [src]="torneo?.imagen" [alt]="torneo?.titulo" class="torneo-poster">
                <div class="torneo-info-text">
                    <h2>{{ torneo?.titulo }}</h2>
                    <p>{{ torneo?.descripcion }}</p>
                    <div class="torneo-details">
                        <div class="detail-item">
                            <i class="fa-solid fa-location-dot"></i>
                            <span>{{ torneo?.lugar }}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fa-regular fa-calendar-days"></i>
                            <span>{{ torneo?.fecha }}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fa-solid fa-clock"></i>
                            <span>{{ torneo?.hora }}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fa-solid fa-trophy"></i>
                            <span>{{ torneo?.premios }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- FORMULARIO DE INSCRIPCIÓN -->
        <section class="registro-section">
            <h2>Registro de Equipo</h2>
            <app-registro-equipos></app-registro-equipos>
        </section>
    </div>
</div>
