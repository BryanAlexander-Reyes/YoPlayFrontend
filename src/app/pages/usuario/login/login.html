<!-- Font Awesome -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
/>

<!-- Tarjeta principal -->
<div class="login-card">
  <!-- =========================================
     SECCIÓN DE BIENVENIDA
     ========================================= -->
  <section class="welcome">
    <div class="card-section">
      <!-- Primera línea -->
      <h1 class="bienvenido">Bienvenido a</h1>

      <!-- Segunda línea: Y ⚽ Play -->
      <div class="logo-yplay">
        <span>Y</span>

        <i class="fa-solid fa-volleyball pelota"></i>

        <span>Play</span>
      </div>

      <!-- Descripción -->
      <p>Ven, ingresa y diviértete</p>
    </div>
  </section>

  <!-- =========================================
         SECCIÓN DE LOGIN
         ========================================= -->
  <section class="login">
    <!-- Título del formulario -->
    <div class="login-section">
      <h1>Iniciar Sesión</h1>
    </div>

    <!-- =====================================
             CORREO
             ===================================== -->
    <div class="form-group">
      <label for="usuario"> Correo Electrónico </label>

      <input type="email" id="usuario" placeholder="Ingrese su correo" />
    </div>

    <!-- =====================================
             CONTRASEÑA
             ===================================== -->
    <div class="form-group">
      <label for="contraseña"> Contraseña </label>

      <input type="password" id="contraseña" placeholder="Ingrese su contraseña" />
    </div>

    <!-- =====================================
             RECUPERAR CONTRASEÑA
             ===================================== -->
    <div class="recover-password">
      <a href="#"> ¿Olvidaste tu contraseña? </a>
    </div>

    <!-- =====================================
             BOTÓN INGRESAR
             ===================================== -->
    <button type="button" class="login-button">Ingresar</button>

    <!-- =====================================
             REGISTRO
             ===================================== -->
    <div class="registro">
      <span> ¿No tienes una cuenta? </span>

      <a href="#"> Regístrate </a>
    </div>

    <!-- =====================================
             LOGIN CON GOOGLE
             ===================================== -->
    <div class="boton">
      <button type="button" class="boton-rapido">
        <i class="fa-brands fa-google"></i>

        <span> Iniciar Sesión con Google </span>
      </button>
    </div>
  </section>
</div>
