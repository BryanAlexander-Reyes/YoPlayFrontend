<!-- =========================================
     REGISTER COMPONENT
     ========================================= -->

<form
  class="register-form-container"
  [formGroup]="registerForm"
  (ngSubmit)="registrar()"
>

  <!-- =========================================
       FORMULARIO 1
       ========================================= -->
  <div
    *ngIf="!mostrarSegundoFormulario"
    class="formulario"
  >

    <!-- TÍTULO -->
    <div class="register-card1">

      <h1>
        Crear Cuenta
      </h1>

      <p>
        Haz parte de nuestra comunidad deportiva
      </p>

    </div>


    <!-- EMAIL -->
    <div class="register-form">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        formControlName="email"
        placeholder="Ingrese su email"
      />

    </div>


    <!-- CONTRASEÑA -->
    <div class="register-form">

      <label for="password">
        Contraseña
      </label>

      <input
        type="password"
        id="password"
        formControlName="password"
        placeholder="Ingrese su contraseña"
      />

    </div>


    <!-- CONFIRMAR CONTRASEÑA -->
    <div class="register-form">

      <label for="confirmPassword">
        Confirmar Contraseña
      </label>

      <input
        type="password"
        id="confirmPassword"
        formControlName='confirmPassword'
        placeholder="Confirme su contraseña"
      />

    </div>


    <!-- VOLVER A LOGIN -->
    <div class="volver-login">

      <span>
        ¿Ya tienes una cuenta?
      </span>

      <a
        (click)="volverALogin()"
      >
        Iniciar sesión
      </a>

    </div>


    <!-- SIGUIENTE -->
    <button
      type="button"
      class="siguiente-button"
      (click)="siguiente()"
    >
      SIGUIENTE
    </button>

  </div>


  <!-- =========================================
       FORMULARIO 2
       ========================================= -->

  <div
    *ngIf="mostrarSegundoFormulario"
    class="formulario"
  >

    <div class="register-card1">

      <h1>
        Datos Básicos
      </h1>

    </div>
      <!-- NOMBRE -->
      <div class="register-form">
        <label for="nombre">
          Nombre
        </label>

        <input
          type="text"
          id="nombre"
          formControlName="nombre"
          placeholder="Nombre"
        />

      </div>


      <!-- APELLIDO -->
      <div class="register-form">
        <label for="apellido">
          Apellido
        </label>
        <input
          type="text"
          id="apellido"
          formControlName="apellido"
          placeholder="Apellido"
        />

      </div>


      <!-- TIPO DE DOCUMENTO -->
      <div class="register-form">

        <label for="tipoDocumento">
          Tipo de documento
        </label>
        <select id="tipoDocumento"
        formControlName="tipoDocumento">

          <option
            value=""
            disabled
            selected
            
          >
            Tipo de documento
          </option>
          @for (tipo of tipoDocumento; track tipo.valor){
            <option
              value="{{ tipo.valor }}"
            >
              {{ tipo.nombre }}
            </option>
          }
        </select>

      </div>


      <!-- IDENTIFICACIÓN -->
      <div class="register-form">
        <label for="identificacion">
          Número de identificación
        </label>
        <input
          type="text"
          id="identificacion"
          formControlName="identificacion"
          placeholder="Número de identificación"
        />

      </div>


      <!-- FECHA DE NACIMIENTO -->
      <div class="register-form">
        <label for="fechaNacimiento">
          Fecha de nacimiento
        </label>
        <input
        placeholder="Fecha de nacimiento"
          type="date"
          id="fechaNacimiento"
          formControlName="fechaNacimiento"
        />

      </div>


      <!-- TÉRMINOS -->
      <div class="terminos">

        <input
          type="checkbox"
          id="terminos"
          formControlName="terminos"
        />

        <label for="terminos">

          Acepto

          <a href="#">
            Términos y Condiciones
          </a>

        </label>

      </div>


      <!-- REGISTRARSE -->
      <button
        type="submit"
        class="siguiente-button"
      >
        REGISTRARSE
      </button>
      <button type="button"class="volver-formulario" (click)="mostrarPrimerFormulario()" ><i class="fa-solid fa-circle-arrow-left"> Volver</i></button>

  </div>

</form>
