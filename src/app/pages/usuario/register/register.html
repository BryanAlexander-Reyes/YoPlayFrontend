<div class="register-card">

  <!-- =====================================================
       FORMULARIO 1
       ===================================================== -->
  <div *ngIf="!mostrarSegundoFormulario" class="formulario">

    <div class="register-card1">
      <h1>Regístrate</h1>
      <p>Haz parte de nuestra comunidad deportiva</p>
    </div>

    <div class="register-form">
      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Ingrese su email"
      />
    </div>

    <div class="register-form">
      <label for="password">Contraseña</label>

      <input
        type="password"
        id="password"
        placeholder="Ingrese su contraseña"
      />
    </div>

    <div class="register-form">
      <label for="confirmPassword">Confirmar Contraseña</label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirme su contraseña"
      />
    </div>

    <button
      type="button"
      class="siguiente-button"
      (click)="siguiente()"
    >
      SIGUIENTE
    </button>

  </div>


  <!-- =====================================================
       FORMULARIO 2
       ===================================================== -->
  <div *ngIf="mostrarSegundoFormulario" class="formulario">

    <div class="register-card1">
      <h1>Datos Básicos</h1>
    </div>

    <form>

      <!-- Nombre -->
      <div class="register-form">
        <input
          type="text"
          id="nombre"
          placeholder="Nombre"
        />
      </div>

      <!-- Apellido -->
      <div class="register-form">
        <input
          type="text"
          id="apellido"
          placeholder="Apellido"
        />
      </div>

      <!-- Tipo de documento -->
      <div class="register-form">

        <select id="tipoDocumento">

          <option
            value=""
            disabled
            selected
          >
            Tipo de documento
          </option>

          <option value="cc">
            Cédula de ciudadanía
          </option>

          <option value="ce">
            Cédula de extranjería
          </option>

          <option value="ti">
            Tarjeta de identidad
          </option>

        </select>

      </div>

      <!-- Número de identificación -->
      <div class="register-form">

        <input
          type="text"
          id="identificacion"
          placeholder="Número de identificación"
        />

      </div>

      <!-- Fecha de nacimiento -->
      <div class="register-form">

        <input
          type="date"
          id="fechaNacimiento"
        />

      </div>

      <!-- Términos -->
      <div class="terminos">

        <input
          type="checkbox"
          id="terminos"
        />

        <label for="terminos">
          Acepto
          <a href="#">
            Términos y Condiciones
          </a>
        </label>

      </div>

      <!-- Registrar -->
      <button
        type="submit"
        class="siguiente-button"
      >
        REGISTRARSE
      </button>

    </form>

  </div>

</div>
