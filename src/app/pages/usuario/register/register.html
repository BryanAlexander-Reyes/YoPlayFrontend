<!-- =========================================
     REGISTER COMPONENT
     ========================================= -->

<div class="register-form-container">

  <!-- =========================================
       FORMULARIO 1
       ========================================= -->
  <div
    *ngIf="!mostrarSegundoFormulario"
    class="formulario"
  >

    <!-- TÍTULO -->
    <div class="register-card1">

      <h1>
        Regístrate
      </h1>

      <p>
        Haz parte de nuestra comunidad deportiva
      </p>

    </div>


    <!-- EMAIL -->
    <div class="register-form">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Ingrese su email"
      />

    </div>


    <!-- CONTRASEÑA -->
    <div class="register-form">

      <label for="password">
        Contraseña
      </label>

      <input
        type="password"
        id="password"
        placeholder="Ingrese su contraseña"
      />

    </div>


    <!-- CONFIRMAR CONTRASEÑA -->
    <div class="register-form">

      <label for="confirmPassword">
        Confirmar Contraseña
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirme su contraseña"
      />

    </div>


    <!-- VOLVER A LOGIN -->
    <div class="volver-login">

      <span>
        ¿Ya tienes una cuenta?
      </span>

      <a
        (click)="volverALogin()"
      >
        Iniciar sesión
      </a>

    </div>


    <!-- SIGUIENTE -->
    <button
      type="button"
      class="siguiente-button"
      (click)="siguiente()"
    >
      SIGUIENTE
    </button>

  </div>


  <!-- =========================================
       FORMULARIO 2
       ========================================= -->

  <div
    *ngIf="mostrarSegundoFormulario"
    class="formulario"
  >

    <div class="register-card1">

      <h1>
        Datos Básicos
      </h1>

    </div>


    <form>

      <!-- NOMBRE -->
      <div class="register-form">

        <input
          type="text"
          id="nombre"
          placeholder="Nombre"
        />

      </div>


      <!-- APELLIDO -->
      <div class="register-form">

        <input
          type="text"
          id="apellido"
          placeholder="Apellido"
        />

      </div>


      <!-- TIPO DE DOCUMENTO -->
      <div class="register-form">

        <select id="tipoDocumento">

          <option
            value=""
            disabled
            selected
          >
            Tipo de documento
          </option>
          @for (tipo of tipoDocumento; track tipo.valor){
            <option
              value="{{ tipo.valor }}"
            >
              {{ tipo.nombre }}
            </option>
          }
        </select>

      </div>


      <!-- IDENTIFICACIÓN -->
      <div class="register-form">

        <input
          type="text"
          id="identificacion"
          placeholder="Número de identificación"
        />

      </div>


      <!-- FECHA DE NACIMIENTO -->
      <div class="register-form">

        <input
          type="date"
          id="fechaNacimiento"
        />

      </div>


      <!-- TÉRMINOS -->
      <div class="terminos">

        <input
          type="checkbox"
          id="terminos"
        />

        <label for="terminos">

          Acepto

          <a href="#">
            Términos y Condiciones
          </a>

        </label>

      </div>


      <!-- REGISTRARSE -->
      <button
        type="submit"
        class="siguiente-button"
      >
        REGISTRARSE
      </button>

    </form>

  </div>

</div>
