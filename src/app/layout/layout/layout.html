<div class="layout-container">
    <aside class="layout-header">
        <app-navigator (userMenuToggle)="toggleUserMenu()" (accessDenied)="openLoginRequired()"></app-navigator>
    </aside>

    <main class="layout-main">
        <section *ngIf="showLoginRequiredModal" class="login-required-page">
            <div class="login-required-card">
                <p class="login-required-title">Lo sentimos.</p>
                <p class="login-required-message">Inicia sesión para acceder a esta funcionalidad.</p>
                <button type="button" class="login-required-button" (click)="goToLogin()">
                    Iniciar sesión
                </button>
            </div>
        </section>

        <router-outlet *ngIf="!showLoginRequiredModal"></router-outlet>
    </main>

    <footer class="layout-footer">
        <app-footer></app-footer>
    </footer>

    <div *ngIf="isUserMenuOpen" class="user-menu-backdrop" [class.is-closing]="isClosingUserMenu" (click)="closeUserMenu()"></div>

    <div *ngIf="isUserMenuOpen" class="sideuser-panel" [class.is-closing]="isClosingUserMenu">
        <app-sideuser (logoutConfirmed)="closeUserMenu()"></app-sideuser>
    </div>
</div>
